<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Paper-craft placeholder artwork: layered cut-paper shapes around a stacked-paper play mark.">
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#24333B" flood-opacity="0.16" />
    </filter>
    <filter id="paper-shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24333B" flood-opacity="0.12" />
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="linear" slope="0.05" />
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#F6F1E8" />

  <!-- back paper layers -->
  <path d="M0 636 C 260 588, 520 660, 780 624 C 1040 588, 1320 648, 1600 606 L1600 900 L0 900 Z" fill="#A7C9D9" opacity="0.55" />
  <path d="M0 706 C 300 668, 560 736, 860 700 C 1140 666, 1360 722, 1600 690 L1600 900 L0 900 Z" fill="#6B9C94" opacity="0.5" />
  <path d="M0 792 C 320 760, 620 812, 920 784 C 1200 758, 1400 796, 1600 776 L1600 900 L0 900 Z" fill="#24333B" opacity="0.12" />

  <!-- cut-paper sun disc -->
  <circle cx="1276" cy="228" r="112" fill="#D4B25F" opacity="0.9" filter="url(#paper-shadow-soft)" />
  <circle cx="1276" cy="228" r="72" fill="#F6F1E8" opacity="0.35" />

  <!-- torn paper strip -->
  <path d="M118 176 L 1120 152 L 1128 236 L 110 262 Z" fill="#FFFDFC" filter="url(#paper-shadow-soft)" />
  <path d="M118 176 L 1120 152 L 1122 168 L 116 192 Z" fill="#E38B73" opacity="0.35" />

  <!-- stacked-paper play mark (identity motif) -->
  <g filter="url(#paper-shadow)">
    <rect x="640" y="400" width="330" height="230" rx="24" fill="#6B9C94" transform="rotate(-4 805 515)" />
    <rect x="660" y="382" width="330" height="230" rx="24" fill="#A7C9D9" transform="rotate(2 825 497)" />
    <rect x="676" y="366" width="330" height="230" rx="24" fill="#FFFDFC" />
    <path d="M786 424 L 906 481 L 786 538 Z" fill="#24333B" />
  </g>

  <!-- small paper props -->
  <rect x="196" y="470" width="150" height="112" rx="14" fill="#FFFDFC" filter="url(#paper-shadow-soft)" transform="rotate(-6 271 526)" />
  <rect x="222" y="500" width="98" height="10" rx="5" fill="#24333B" opacity="0.25" transform="rotate(-6 271 505)" />
  <rect x="222" y="524" width="70" height="10" rx="5" fill="#24333B" opacity="0.18" transform="rotate(-6 257 529)" />

  <rect x="1210" y="466" width="132" height="132" rx="18" fill="#E38B73" filter="url(#paper-shadow-soft)" transform="rotate(5 1276 532)" />
  <circle cx="1276" cy="532" r="34" fill="#F6F1E8" opacity="0.75" />

  <rect width="1600" height="900" fill="#F6F1E8" opacity="0.001" filter="url(#grain)" />
</svg>
